<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crawl-chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0c0c'/%3E%3Ctext x='2' y='12' font-family='monospace' font-size='11' fill='%2316c60c'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
/* Windows Terminal "Campbell" palette */
:root {
  --bg: #0c0c0c; --bar: #1f1f1f; --fg: #cccccc; --dim: #767676; --white: #f2f2f2;
  --red: #e74856; --green: #16c60c; --yellow: #c19c00; --byellow: #f9f1a5;
  --blue: #3b78ff; --cyan: #61d6d6; --purple: #b4009e; --sel: #264f78;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--mono); }
::selection { background: var(--sel); }
body { display: flex; flex-direction: column; }
.titlebar { display: flex; gap: 14px; align-items: center; background: var(--bar); padding: 6px 14px; font-size: 12.5px; color: var(--dim); border-bottom: 1px solid #333; }
.titlebar b { color: var(--white); font-weight: 600; }
.titlebar .grow { flex: 1; }
#ai.on { color: var(--green); } #ai.off { color: var(--yellow); }
#screen { flex: 1; overflow-y: auto; padding: 12px 16px 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.line { min-height: 1.5em; }
.dim { color: var(--dim); } .g { color: var(--green); } .r { color: var(--red); } .y { color: var(--yellow); }
.c { color: var(--cyan); } .b { color: var(--blue); } .w { color: var(--white); } .p { color: var(--purple); }
.ps1 { color: var(--green); } .ps1 .path { color: var(--blue); }
.ex { cursor: pointer; } .ex:hover, .ex:focus { background: var(--fg); color: var(--bg); outline: none; }
.ex:hover *, .ex:focus * { color: var(--bg); }
.turn { margin: 4px 0 14px; }
.blink { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.log { color: var(--dim); max-height: 16em; overflow-y: auto; border-left: 2px solid #333; padding-left: 10px; margin: 2px 0 4px 2px; }
.log .t { color: #5a5a5a; }
details { margin: 2px 0; }
summary { cursor: pointer; color: var(--dim); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "[+] "; color: var(--cyan); }
details[open] > summary::before { content: "[-] "; }
summary:hover { color: var(--fg); }
.box { border-left: 2px solid #333; padding-left: 10px; margin: 2px 0 6px 2px; }
.hd { color: var(--white); font-weight: 700; margin-top: 10px; }
.hd .dim { font-weight: 400; }
.verdict { margin-top: 8px; font-weight: 700; }
.indent { padding-left: 2ch; }
table { border-collapse: collapse; margin: 4px 0 4px 2ch; font: inherit; }
.tw { overflow-x: auto; }
th { color: var(--dim); font-weight: 400; text-align: left; padding: 0 2ch 0 0; border-bottom: 1px dashed #444; white-space: nowrap; }
td { padding: 1px 2ch 1px 0; vertical-align: top; }
td.ev { color: var(--dim); }
button.t { font: inherit; background: none; border: 0; color: var(--cyan); cursor: pointer; padding: 0; }
button.t:hover, button.t:focus-visible { background: var(--cyan); color: var(--bg); outline: none; }
pre.json { margin: 4px 0 0 2ch; max-height: 30em; overflow: auto; white-space: pre; font: inherit; color: var(--fg); }
.jk { color: var(--cyan); } .js { color: var(--green); } .jn { color: var(--byellow); } .jl { color: var(--purple); }
form { display: flex; gap: 1ch; align-items: flex-start; padding: 8px 16px 10px; border-top: 1px solid #333; background: var(--bg); }
form .ps1 { white-space: nowrap; padding-top: 1px; }
textarea { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--white); font: inherit; resize: none; outline: none; padding: 0; caret-color: var(--green); height: 1.5em; max-height: 9em; }
textarea::placeholder { color: #4a4a4a; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 640px) {
  html, body { font-size: 13px; }
  #screen { padding: 10px 12px 4px; } form { padding: 8px 12px 10px; }
  .ps1 .host { display: none; } .titlebar .hide-sm { display: none; }
  table { margin-left: 0; }
}
</style>
</head>
<body>
<div class="titlebar">
  <b>crawl-chat</b><span class="hide-sm">fastapi · subprocess · crawler_cli.py</span>
  <span class="grow"></span><span id="ai">gemini: checking…</span>
</div>

<main id="screen" aria-live="polite" aria-label="Session output"></main>

<form id="form" autocomplete="off">
  <label for="input" class="sr">Type a request</label>
  <span class="ps1" aria-hidden="true"><span class="host">you@crawl-chat:</span><span class="path">~</span>$</span>
  <textarea id="input" rows="1" maxlength="4000" spellcheck="false" placeholder="crawl https://books.toscrape.com and return titles and prices as json"></textarea>
  <button type="submit" class="t" id="send">[enter]</button>
  <button type="button" class="t" id="stop" hidden>[esc] cancel</button>
</form>

<script>
"use strict";
// Text from crawled websites is untrusted: everything below is inserted with textContent / DOM nodes, never innerHTML.

const $ = (id) => document.getElementById(id);
const screen = $("screen"), input = $("input"), sendBtn = $("send"), stopBtn = $("stop");
let controller = null, currentRun = null;

const EXAMPLES = [
  ["mandatory demo", "Crawl https://example.com, extract the important information, give me a summary, and return the extracted data in JSON format."],
  ["multi-page extraction", "Crawl 3 pages of https://books.toscrape.com and return book titles and prices as JSON"],
  ["ssrf: metadata ip", "Summarise http://169.254.169.254/latest/meta-data"],
  ["robots.txt disallow", "Crawl https://www.google.com/search?q=test"],
  ["unreachable host", "Crawl https://this-domain-does-not-exist-xyz.com"],
];

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null && c !== false) n.append(c);
  return n;
}
const span = (cls, text) => el("span", { class: cls, text });
const line = (...kids) => el("div", { class: "line" }, ...kids);
const out = (node) => { screen.append(node); screen.scrollTop = screen.scrollHeight; return node; };
const secs = (ms) => (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + "s";
const kb = (b) => (b < 1024 ? b + " B" : (b / 1024).toFixed(1) + " KB");

function motd(extra) {
  const box = el("div", { class: "turn" });
  box.append(
    line(span("w", "crawl-chat 1.1"), span("dim", "  natural language → validated task → real CLI process → verified answer")),
    line(span("dim", "allowlist: site_crawler (cli/crawler_cli.py) · shell=False · public http(s) only · robots.txt respected")),
    line(""),
    line(span("dim", "examples: click one, or type its number")),
  );
  EXAMPLES.concat(extra || []).forEach(([label, text], i) => {
    const row = line(span("c", `  ${i + 1}  `), span("w", label.padEnd(24, " ")), span("dim", text.length > 70 ? text.slice(0, 70) + "…" : text));
    row.className = "line ex"; row.tabIndex = 0; row.title = text;
    const go = () => run(text);
    row.addEventListener("click", go);
    row.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    box.append(row);
  });
  box.append(line(""), line(span("dim", "commands: help · clear · esc cancels a running crawl")));
  out(box);
}

let extraExamples = [];
async function health() {
  const ai = $("ai");
  try {
    const h = await (await fetch("/api/health")).json();
    ai.textContent = h.llm_configured ? "gemini: " + h.models[0] : "gemini: off (rule-based fallback)";
    ai.className = h.llm_configured ? "on" : "off";
    if (h.testpages_enabled) extraExamples = [["prompt-injection page", `Summarise http://127.0.0.1:${location.port}/testpages/ and its menu page`]];
  } catch { ai.textContent = "backend: unreachable"; ai.className = "off"; }
  motd(extraExamples);
}

function jsonView(obj) {
  const text = JSON.stringify(obj, null, 2), pre = el("pre", { class: "json" });
  const re = /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) pre.append(text.slice(last, m.index));
    const t = m[0];
    pre.append(span(t.startsWith('"') ? (m[2] ? "jk" : "js") : /^(true|false|null)$/.test(t) ? "jl" : "jn", t));
    last = re.lastIndex;
  }
  pre.append(text.slice(last));
  return pre;
}

const MARK = {
  running: () => [span("y", "[ "), span("y blink", "...."), span("y", " ]")],
  done: () => [span("g", "[  OK  ]")],
  failed: () => [span("r", "[FAILED]")],
};
const STATUS_CLS = { success: "g", partial: "y", not_run: "dim" };

class Turn {
  constructor(message) {
    this.box = out(el("div", { class: "turn" }));
    this.box.append(line(el("span", { class: "ps1" }, span("host", "you@crawl-chat:"), span("path", "~"), "$ "), span("w", message)));
    this.steps = {};
    this.log = null;
  }
  add(node) { this.box.append(node); screen.scrollTop = screen.scrollHeight; return node; }
  step(s) {
    let row = this.steps[s.id];
    if (!row) row = this.steps[s.id] = this.add(line());
    const label = s.label.padEnd(36, " ");
    row.replaceChildren(...MARK[s.state](), " ", span(s.state === "failed" ? "r" : "", label),
      s.ms != null ? span("dim", secs(s.ms).padStart(7, " ") + "  ") : "", s.detail ? span("dim", s.detail) : "");
  }
  plan(p) {
    const rows = [["understood", p.explanation], ["task", p.task], ["url", p.url], ["max_pages", p.max_pages], ["max_depth", p.max_depth],
      ["fields", (p.fields_requested || []).join(", ")], ["json", p.wants_json ? "yes" : "no"], ["parsed by", p.parsed_by], ["notes", (p.notes || []).join("; ")]];
    const body = el("div", { class: "box" });
    for (const [k, v] of rows) if (v !== null && v !== undefined && v !== "") body.append(line(span("dim", k.padEnd(12, " ")), String(v)));
    this.add(el("details", {}, el("summary", { text: "plan (from the intent layer)" }), body));
  }
  command(c) {
    const argv = c.argv.map((a) => (/[\s"]/.test(a) ? JSON.stringify(a) : a)).join(" ");
    this.add(line(span("g", "$ "), span("w", argv), span("dim", `   # shell=${c.shell}, hard timeout ${c.timeout_s}s`)));
    this.log = this.add(el("div", { class: "log" }));
  }
  logLine(p) {
    if (!this.log) this.log = this.add(el("div", { class: "log" }));
    this.log.append(line(span("t", ("+" + secs(p.t_ms)).padStart(8, " ") + "  "), p.line));
    this.log.scrollTop = this.log.scrollHeight;
    screen.scrollTop = screen.scrollHeight;
  }
  security(p) {
    for (const f of p.flags) {
      let path = f.page; try { path = new URL(f.page).pathname; } catch {}
      this.add(line(span("r", "[ WARN ] "), span("y", `${f.type} on ${path}: `), span("dim", f.snippet)));
    }
    this.add(line(span("dim", "         ↳ treated as page data, never as instructions; the model has no tools")));
  }
  final(f) {
    const st = f.status || "failed";
    const cls = STATUS_CLS[st] || "r";
    this.add(el("div", { class: "verdict" }, span(cls, "==> " + st.toUpperCase().replace("_", " ") + "  "), span(cls === "dim" ? "" : "w", f.message)));
    const x = f.execution;
    if (x) {
      const bits = [`run ${x.run_id}`, x.pid != null ? `pid ${x.pid}` : null, `exit ${x.exit_code ?? "—"}`, `${secs(x.duration_ms)}`,
        x.stdout_bytes ? `stdout ${kb(x.stdout_bytes)}` : null, x.stdout_sha256 ? `sha256 ${x.stdout_sha256.slice(0, 12)}…` : null].filter(Boolean);
      this.add(line(span("dim", "    " + bits.join(" · "))));
    }
    if (f.audit_file) this.add(line(span("dim", `    audit log: ${f.audit_file}  (total ${secs(f.total_ms)})`)));
    if (f.detail) this.add(line(span("dim", "    " + f.detail)));
    for (const w of (x && x.warnings) || []) this.add(line(span("y", "    warning: " + w)));
    if (f.summary_note) this.add(line(span("y", "    note: " + f.summary_note)));

    if (f.summary) this.add(el("div", { class: "hd", text: "SUMMARY" })), this.add(el("div", { class: "indent", text: f.summary }));
    if (f.key_points && f.key_points.length) {
      this.add(el("div", { class: "hd", text: "KEY POINTS" }));
      for (const k of f.key_points) this.add(line(span("dim", "  - "), k));
    }
    if (f.extracted && f.extracted.length) {
      const n = (lvl) => f.extracted.filter((e) => e.verification === lvl).length;
      this.add(el("div", { class: "hd" }, "EXTRACTED DATA ", span("dim", `(${n("verified")} verified · ${n("paraphrased")} paraphrased · ${n("unverified")} unverified, checked against the crawled text)`)));
      const tb = el("tbody");
      const tag = { verified: ["g", "[✓]"], paraphrased: ["y", "[≈]"], unverified: ["r", "[✗]"] };
      for (const e of f.extracted) {
        const [c, t] = tag[e.verification] || tag.unverified;
        let path = e.source_url; try { path = new URL(e.source_url).pathname; } catch {}
        tb.append(el("tr", {}, el("td", { class: c, title: e.verification_note, text: t }), el("td", { class: "c", text: e.field }),
          el("td", { class: "w", text: e.value }), el("td", { class: "ev", text: "“" + e.evidence + "”" }),
          el("td", {}, /^https?:\/\//.test(e.source_url) ? el("a", { href: e.source_url, target: "_blank", rel: "noopener noreferrer", class: "b", text: path }) : e.source_url)));
      }
      this.add(el("div", { class: "tw" }, el("table", {}, el("thead", {}, el("tr", {}, ...["", "field", "value", "evidence", "source"].map((h) => el("th", { text: h })))), tb)));
      this.add(line(span("dim", "  hover a mark to see why it got that grade")));
    }
    if (f.json) {
      const text = JSON.stringify(f.json, null, 2);
      const copy = el("button", { class: "t", type: "button", text: "[copy]", onclick: async () => {
        try { await navigator.clipboard.writeText(text); copy.textContent = "[copied]"; } catch { copy.textContent = "[copy failed]"; }
        setTimeout(() => (copy.textContent = "[copy]"), 1500);
      } });
      const save = el("button", { class: "t", type: "button", text: "[download]", onclick: () => {
        const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: `crawl-${f.run_id}.json` });
        a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      } });
      const d = el("details", f.json_requested ? { open: "" } : {}, el("summary", {}, span("w", "JSON"), span("dim", ` valid · ${kb(text.length)} · built by the server from the crawl `)), line("  ", copy, " ", save), jsonView(f.json));
      this.add(d);
    }
    if (f.stderr && st !== "success") {
      this.add(el("details", {}, el("summary", { text: "captured stderr" }), el("div", { class: "log", text: f.stderr })));
    }
  }
}

function localCommand(text) {
  const t = text.trim().toLowerCase();
  if (t === "clear" || t === "cls") { screen.replaceChildren(); return true; }
  if (t === "help" || t === "?") { motd(extraExamples); return true; }
  const all = EXAMPLES.concat(extraExamples);
  if (/^\d+$/.test(t) && +t >= 1 && +t <= all.length) { run(all[+t - 1][1]); return true; }
  return false;
}

async function run(message) {
  message = (message || "").trim();
  if (!message || controller) return;
  input.value = ""; autosize();
  if (localCommand(message)) return;
  const turn = new Turn(message);
  controller = new AbortController();
  sendBtn.hidden = true; stopBtn.hidden = false;
  let gotFinal = false;
  try {
    const res = await fetch("/api/chat/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message }), signal: controller.signal });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = "message", data = "";
        for (const l of chunk.split("\n")) {
          if (l.startsWith("event: ")) ev = l.slice(7);
          else if (l.startsWith("data: ")) data += l.slice(6);
        }
        if (!data) continue;
        const p = JSON.parse(data);
        if (ev === "start") currentRun = p.run_id;
        else if (ev === "step") turn.step(p);
        else if (ev === "plan") turn.plan(p);
        else if (ev === "command") turn.command(p);
        else if (ev === "log") turn.logLine(p);
        else if (ev === "security") turn.security(p);
        else if (ev === "final") { gotFinal = true; turn.final(p); }
      }
    }
    if (!gotFinal) turn.final({ status: "failed", message: "connection closed before a result arrived; nothing is shown because nothing was confirmed" });
  } catch (e) {
    if (!gotFinal) turn.final(e.name === "AbortError"
      ? { status: "cancelled", message: "cancelled; the crawler process was stopped on the server" }
      : { status: "failed", message: "could not reach the backend (" + e.message + ")" });
  } finally {
    controller = null; currentRun = null;
    sendBtn.hidden = false; stopBtn.hidden = true; input.focus();
  }
}

async function cancel() {
  if (!controller) return;
  const id = currentRun;
  if (id) { try { await fetch("/api/cancel/" + encodeURIComponent(id), { method: "POST" }); } catch {} }
  setTimeout(() => controller && controller.abort(), 1500); // let the server report 'cancelled' first
}

stopBtn.addEventListener("click", cancel);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cancel(); });
$("form").addEventListener("submit", (e) => { e.preventDefault(); run(input.value); });
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 9 * 21) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); run(input.value); } });
screen.addEventListener("click", () => { if (!window.getSelection().toString()) input.focus(); });
health();
input.focus();
</script>
</body>
</html>
